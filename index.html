<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Pro - Sorteio Eletrônico</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%231e293b%22 stroke=%22%23fbbf24%22 stroke-width=%226%22/><circle cx=%2245%22 cy=%2245%22 r=%2222%22 fill=%22%23ffffff%22/><text x=%2250%22 y=%2268%22 font-family=%22sans-serif%22 font-size=%2252%22 font-weight=%22900%22 fill=%22%23dc2626%22 text-anchor=%22middle%22>75</text></svg>">

    <style>
        :root {
            --bg-main: #0f172a;       
            --bg-card: #1e293b;       
            --primary: #d97706;       
            --primary-hover: #b45309; 
            --accent: #f59e0b;        
            --ball-text: #dc2626;     
            --text-main: #f8fafc;     
            --text-muted: #94a3b8;    
            --divider: #334155;       
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .app-window {
            background-color: var(--bg-card);
            width: 100vw;
            height: 100vh;
            max-width: 1400px;
            max-height: 850px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(245, 158, 11, 0.1);
            border: 1px solid var(--divider);
            display: flex;
            flex-direction: column;
            padding: 35px;
            overflow: hidden;
            z-index: 2; /* Garante que fica acima do fundo mas abaixo dos confetes */
        }

        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding-bottom: 20px;
            border-bottom: 2px dashed var(--divider);
        }

        .logo-icon {
            width: 45px;
            height: 45px;
        }

        h1 {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-main);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        h1 span {
            color: var(--accent);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #painelInicial {
            text-align: center;
        }

        #painelInicial p {
            color: var(--text-muted);
            font-size: 18px;
            margin-bottom: 25px;
        }

        #painelJogo {
            width: 100%;
            height: 100%;
            display: flex;
            gap: 30px;
            overflow: hidden;
            padding: 20px 0;
        }

        .coluna-esquerda {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 2px dashed var(--divider);
            padding-right: 15px;
        }

        .coluna-direita {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-left: 15px;
            overflow: hidden;
        }

        #rodadaTexto {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 15px;
        }

        .bola-bingo {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f8fafc 25%, #cbd5e1 75%, #94a3b8 100%);
            border: 6px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 76px;
            font-weight: 900;
            color: var(--ball-text);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7), inset -10px -10px 25px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            transition: transform 0.15s ease;
        }

        .animando {
            animation: balancar 0.15s infinite alternate;
        }

        @keyframes balancar {
            from { transform: translateY(-5px) rotate(-6deg); }
            to { transform: translateY(5px) rotate(6deg); }
        }

        .contador-restante {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            background-color: rgba(15, 23, 42, 0.4);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--divider);
            color: var(--text-muted);
            margin-bottom: 25px;
            letter-spacing: 0.05em;
        }
        
        .contador-restante span {
            color: var(--accent);
            font-weight: 800;
        }

        .status {
            font-size: 15px;
            font-style: italic;
            color: var(--text-muted);
            min-height: 22px;
            margin-bottom: 25px;
        }

        button {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: var(--text-main);
            border: none;
            padding: 18px 45px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 119, 6, 0.4);
            filter: brightness(1.1);
        }

        button:disabled {
            background: #475569;
            color: #1e293b;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            filter: none;
        }

        .coluna-direita h3 {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .historico-container {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--divider);
            border-radius: 16px;
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            grid-auto-rows: max-content;
            gap: 12px;
            align-content: start;
        }

        .item-historico {
            font-size: 14px;
            color: var(--text-muted);
            background: rgba(51, 65, 85, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(51, 65, 85, 0.5);
            text-align: center;
        }

        .item-historico strong {
            color: var(--accent);
            font-size: 16px;
            display: block;
            margin-top: 2px;
        }

        /* Estilos dos Elementos de Confete */
        .confete {
            position: absolute;
            width: 12px;
            height: 12px;
            z-index: 999;
            top: -20px;
            opacity: 0.8;
            animation: cair linear forwards;
        }

        @keyframes cair {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<div class="app-window">
    <header>
        <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="45" fill="#1e293b" stroke="#f59e0b" stroke-width="5"/>
            <circle cx="44" cy="44" r="20" fill="#ffffff"/>
            <text x="50" y="68" font-family="sans-serif" font-size="48" font-weight="900" fill="#dc2626" text-anchor="middle">75</text>
        </svg>
        <h1>BINGO <span>PRO</span></h1>
    </header>
    
    <main class="main-content">
        <div id="painelInicial">
            <p>Prepare o seu bilhete! Pronto para iniciar o sorteio oficial?</p>
            <button onclick="iniciarJogo()">Abrir Sala de Jogo</button>
        </div>

        <div id="painelJogo" style="display: none;">
            <div class="coluna-esquerda">
                <div id="rodadaTexto">Gire o Globo!</div>
                <div class="bola-bingo" id="numeroSorteado">--</div>
                <div class="contador-restante" id="contadorRestante">Restam: <span id="numerosFaltando">75</span> / 75</div>
                <div class="status" id="statusAnimacao"></div>
                <button id="btnSortear" onclick="sortearNumero()">Sortear Número</button>
            </div>

            <div class="coluna-direita">
                <h3>Histórico das Rodadas</h3>
                <div class="historico-container" id="historicoContainer">
                    <div id="itemVazio" style="color: var(--text-muted); font-style: italic; grid-column: 1 / -1; text-align: center; padding-top: 50px;">
                        Nenhuma bola sorteada neste painel ainda.
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    let rodada = 1;
    let numeros = [];
    let sorteados = [];
    let audioCtx = null;

    for (let i = 1; i <= 75; i++) {
        numeros.push(i);
    }

    // Gerador de som nativo do navegador (Web Audio API)
    function tocarSom(frequencia, tipo, duracao, delay = 0) {
        setTimeout(() => {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                let oscilador = audioCtx.createOscillator();
                let ganho = audioCtx.createGain();
                
                oscilador.type = tipo; // 'sine', 'square', 'sawtooth', 'triangle'
                oscilador.frequency.setValueAtTime(frequencia, audioCtx.currentTime);
                
                ganho.gain.setValueAtTime(0.1, audioCtx.currentTime);
                ganho.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duracao);
                
                oscilador.connect(ganho);
                ganho.connect(audioCtx.destination);
                
                oscilador.start();
                oscilador.stop(audioCtx.currentTime + duracao);
            } catch (e) {
                console.log("Áudio bloqueado ou não suportado:", e);
            }
        }, delay);
    }

    function tocarSomInicio() {
        tocarSom(300, 'triangle', 0.15, 0);
        tocarSom(450, 'triangle', 0.15, 100);
        tocarSom(600, 'triangle', 0.3, 200);
    }

    function tocarSomRodada() {
        tocarSom(523.25, 'sine', 0.1, 0); // Nota C5 rápida
    }

    function tocarSomFinal() {
        // Fanfarra triunfal clássica de vitória
        tocarSom(523.25, 'square', 0.2, 0);   // C5
        tocarSom(659.25, 'square', 0.2, 150); // E5
        tocarSom(783.99, 'square', 0.2, 300); // G5
        tocarSom(1046.50, 'square', 0.5, 450); // C6 sustentado
    }

    function iniciarJogo() {
        tocarSomInicio();
        document.getElementById("painelInicial").style.display = "none";
        document.getElementById("painelJogo").style.display = "flex";
        document.getElementById("rodadaTexto").innerText = "Globo pronto!";
        document.getElementById("numerosFaltando").innerText = numeros.length;
    }

    function formatarNumero(num) {
        return String(num).padStart(2, '0');
    }

    function sortearNumero() {
        if (numeros.length === 0) return;

        const btn = document.getElementById("btnSortear");
        const status = document.getElementById("statusAnimacao");
        const bola = document.getElementById("numeroSorteado");
        const txtFaltando = document.getElementById("numerosFaltando");
        
        btn.disabled = true;
        bola.classList.add("animando");
        status.innerText = "Misturando o globo de pedras .";

        // Bipes sutis de rotação do globo
        tocarSom(150, 'sawtooth', 0.05, 0);
        setTimeout(() => { status.innerText = "Misturando o globo de pedras . ."; tocarSom(180, 'sawtooth', 0.05, 0); }, 250);
        setTimeout(() => { status.innerText = "Misturando o globo de pedras . . ."; tocarSom(210, 'sawtooth', 0.05, 0); }, 500);
        
        setTimeout(() => {
            bola.classList.remove("animando");
            status.innerText = "";
            
            const indiceAleatorio = Math.floor(Math.random() * numeros.length);
            const numeroSorteado = numeros[indiceAleatorio];

            sorteados.push(numeroSorteado);
            numeros.splice(indiceAleatorio, 1);

            document.getElementById("rodadaTexto").innerText = `Rodada ${formatarNumero(rodada)}`;
            bola.innerText = formatarNumero(numeroSorteado);
            
            txtFaltando.innerText = numeros.length;
            
            atualizarHistorico();

            rodada++;
            btn.disabled = false;

            if (numeros.length === 0) {
                tocarSomFinal();
                dispararConfetes();
                status.innerHTML = "<strong style='color: var(--accent);'>Fim do sorteio! Todas as 75 pedras saíram.</strong>";
                btn.disabled = true;
                btn.innerText = "Concluído";
            } else {
                tocarSomRodada();
            }
        }, 750);
    }

    function atualizarHistorico() {
        const container = document.getElementById("historicoContainer");
        
        const itemVazio = document.getElementById("itemVazio");
        if (itemVazio) itemVazio.remove();
        
        const ultimoIndex = sorteados.length - 1;
        const num = sorteados[ultimoIndex];
        
        const item = document.createElement("div");
        item.className = "item-historico";
        item.innerHTML = `${formatarNumero(ultimoIndex + 1)}º nº:<strong>${formatarNumero(num)}</strong>`;
        
        container.appendChild(item);
        container.scrollTop = container.scrollHeight;
    }

    // Mecânica de Animação de Aniversário (Confetes)
    function dispararConfetes() {
        const cores = ['#fbbf24', '#f59e0b', '#ef4444', '#3b82f6', '#10b981', '#ec4899'];
        
        // Loop para gerar 150 pedaços de confete na tela
        for (let i = 0; i < 150; i++) {
            const confete = document.createElement('div');
            confete.className = 'confete';
            
            // Características randômicas para cada papel picado
            confete.style.left = Math.random() * 100 + 'vw';
            confete.style.backgroundColor = cores[Math.floor(Math.random() * cores.length)];
            confete.style.animationDuration = (Math.random() * 3 + 2) + 's'; // Entre 2s e 5s para cair
            confete.style.animationDelay = (Math.random() * 2) + 's'; // Cascata de queda de até 2s
            confete.style.transform = `scale(${Math.random() * 1 + 0.5})`; // Tamanhos variados
            
            document.body.appendChild(confete);
            
            // Remove o elemento após a animação acabar para não acumular memória
            setTimeout(() => { confete.remove(); }, 7000);
        }
    }
</script>

</body>
</html>
