<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Pro - Sorteio Eletrônico</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%231e293b%22 stroke=%22%23fbbf24%22 stroke-width=%226%22/><circle cx=%2245%22 cy=%2245%22 r=%2222%22 fill=%22%23ffffff%22/><text x=%2250%22 y=%2268%22 font-family=%22sans-serif%22 font-size=%2252%22 font-weight=%22900%22 fill=%22%23dc2626%22 text-anchor=%22middle%22>75</text></svg>">

    <style>
        :root {
            --bg-main: #0f172a;       /* Azul escuro profundo (fundo) */
            --bg-card: #1e293b;       /* Azul ardósia (painéis) */
            --primary: #d97706;       /* Ouro / Âmbar escuro */
            --primary-hover: #b45309; /* Ouro mais escuro */
            --accent: #f59e0b;        /* Ouro brilhante para destaques */
            --ball-text: #dc2626;     /* Vermelho vivo para o número sorteado */
            --text-main: #f8fafc;     /* Branco quase puro */
            --text-muted: #94a3b8;    /* Cinza azulado */
            --divider: #334155;       /* Linha divisória suave */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Layout Full Screen Responsivo */
        .app-window {
            background-color: var(--bg-card);
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 850px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(245, 158, 11, 0.1);
            border: 1px solid var(--divider);
            display: flex;
            flex-direction: column;
            padding: 40px;
            overflow: hidden;
        }

        /* Topo com o Ícone SVG Novo */
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding-bottom: 25px;
            border-bottom: 2px dashed var(--divider);
        }

        .logo-icon {
            width: 50px;
            height: 50px;
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-main);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        h1 span {
            color: var(--accent);
        }

        /* Área Central do Jogo */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 0;
        }

        #painelInicial {
            text-align: center;
        }

        #painelInicial p {
            color: var(--text-muted);
            font-size: 18px;
            margin-bottom: 25px;
        }

        #painelJogo {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
        }

        .sorteio-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: auto;
        }

        #rodadaTexto {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
        }

        /* Bola de Bingo Estilo Cassino */
        .bola-bingo {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f8fafc 25%, #cbd5e1 75%, #94a3b8 100%);
            border: 6px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 68px;
            font-weight: 900;
            color: var(--ball-text);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7), inset -10px -10px 25px rgba(0,0,0,0.15);
            margin-bottom: 25px;
            transition: transform 0.15s ease;
        }

        .animando {
            animation: balancar 0.15s infinite alternate;
        }

        @keyframes balancar {
            from { transform: translateY(-5px) rotate(-6deg); }
            to { transform: translateY(5px) rotate(6deg); }
        }

        .status {
            font-size: 15px;
            font-style: italic;
            color: var(--text-muted);
            min-height: 22px;
            margin-bottom: 20px;
        }

        /* Botões Estilizados */
        button {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: var(--text-main);
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 119, 6, 0.4);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background: #475569;
            color: #1e293b;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            filter: none;
        }

        /* Histórico de Sorteados Inferior (Separado por Linha) */
        .historico-section {
            width: 100%;
            border-top: 2px dashed var(--divider);
            padding-top: 25px;
            margin-top: auto;
        }

        .historico-section h3 {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-align: left;
        }

        .historico-container {
            display: flex;
            gap: 20px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--divider);
            border-radius: 16px;
            padding: 20px;
            height: 180px;
            overflow-x: auto;
            align-items: flex-start;
        }

        .coluna-historico {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 120px;
            flex-shrink: 0;
        }

        /* Barras verticais separadoras */
        .coluna-historico:not(:first-child) {
            border-left: 2px solid var(--divider);
            padding-left: 20px;
        }

        .item-historico {
            font-size: 14px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .item-historico strong {
            color: var(--accent);
            font-size: 16px;
            margin-left: 5px;
        }
    </style>
</head>
<body>

<div class="app-window">
    <header>
        <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="45" fill="#1e293b" stroke="#f59e0b" stroke-width="5"/>
            <circle cx="44" cy="44" r="20" fill="#ffffff"/>
            <text x="50" y="68" font-family="sans-serif" font-size="48" font-weight="900" fill="#dc2626" text-anchor="middle">75</text>
        </svg>
        <h1>BINGO <span>PRO</span></h1>
    </header>
    
    <main class="main-content">
        <div id="painelInicial">
            <p>Prepare o seu bilhete! Pronto para iniciar o sorteio oficial?</p>
            <button onclick="iniciarJogo()">Abrir Sala de Jogo</button>
        </div>

        <div id="painelJogo" style="display: none;">
            <div class="sorteio-section">
                <div id="rodadaTexto">Gire o Globo!</div>
                <div class="bola-bingo" id="numeroSorteado">--</div>
                <div class="status" id="statusAnimacao"></div>
                <button id="btnSortear" onclick="sortearNumero()">Sortear Número</button>
            </div>

            <div class="historico-section">
                <h3>Histórico das Rodadas (Colunas de 10)</h3>
                <div class="historico-container" id="historicoContainer">
                    <div style="color: var(--text-muted); font-style: italic; width: 100%; text-align: center; padding-top: 50px;">
                        Nenhuma bola sorteada neste painel ainda.
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    let rodada = 1;
    let numeros = [];
    let sorteados = [];

    for (let i = 1; i <= 75; i++) {
        numeros.push(i);
    }

    function iniciarJogo() {
        document.getElementById("painelInicial").style.display = "none";
        document.getElementById("painelJogo").style.display = "flex";
        document.getElementById("rodadaTexto").innerText = "Globo pronto!";
    }

    function formatarNumero(num) {
        return String(num).padStart(2, '0');
    }

    function sortearNumero() {
        if (numeros.length === 0) return;

        const btn = document.getElementById("btnSortear");
        const status = document.getElementById("statusAnimacao");
        const bola = document.getElementById("numeroSorteado");
        
        btn.disabled = true;
        bola.classList.add("animando");
        status.innerText = "Misturando o globo de pedras .";

        setTimeout(() => { status.innerText = "Misturando o globo de pedras . ."; }, 250);
        setTimeout(() => { status.innerText = "Misturando o globo de pedras . . ."; }, 500);
        
        setTimeout(() => {
            bola.classList.remove("animando");
            status.innerText = "";
            
            const indiceAleatorio = Math.floor(Math.random() * numeros.length);
            const numeroSorteado = numeros[indiceAleatorio];

            sorteados.push(numeroSorteado);
            numeros.splice(indiceAleatorio, 1);

            document.getElementById("rodadaTexto").innerText = `Rodada ${formatarNumero(rodada)}`;
            bola.innerText = formatarNumero(numeroSorteado);
            
            atualizarHistorico();

            rodada++;
            btn.disabled = false;

            if (numeros.length === 0) {
                status.innerHTML = "<strong style='color: var(--accent);'>Fim do sorteio! Todas as 75 pedras saíram.</strong>";
                btn.disabled = true;
                btn.innerText = "Concluído";
            }
        }, 750);
    }

    function atualizarHistorico() {
        const container = document.getElementById("historicoContainer");
        container.innerHTML = "";
        
        let colunaAtual = null;

        sorteados.forEach((num, index) => {
            if (index % 10 === 0) {
                colunaAtual = document.createElement("div");
                colunaAtual.className = "coluna-historico";
                container.appendChild(colunaAtual);
            }
            
            const item = document.createElement("div");
            item.className = "item-historico";
            item.innerHTML = `${formatarNumero(index + 1)}º nº:<strong>${formatarNumero(num)}</strong>`;
            
            colunaAtual.appendChild(item);
        });

        // Mantém a rolagem automática horizontal travada na coluna mais recente
        container.scrollLeft = container.scrollWidth;
    }
</script>

</body>
</html>
